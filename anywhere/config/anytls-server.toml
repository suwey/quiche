# AnyTLS 服务端最简配置。
# 客户端侧参考 anytls-client.toml，对应的 outbound 写法：
#   [[outbounds]]
#   type = "anytls"
#   server = "<本机地址>:8443"
#   password = "secret"
#   sni = "localhost"        # 域名证书填证书域名，IP + insecure = true 可省
#   insecure = true          # 自签证书时需要

[[users]]
name = "alice"
password = "secret"

[[inbounds]]
type = "anytls"
listen = "0.0.0.0:8443"
cert = "cert.pem"
key = "key.pem"
# 可选：自定义 padding 方案（省略时使用内置默认方案）
# padding_scheme = """
# stop=8
# 0=30-30
# 1=100-400
# """

[[outbounds]]
type = "direct"
tag = "direct-out"

[[rules]]
outbound = "direct-out"
