# VLESS 服务端最简配置（ws 传输模式）。
#
# 客户端侧参考 vless-client.toml，对应的 outbound 写法：
#   [[outbounds]]
#   type = "vless"
#   server = "<本机地址>:8443"
#   password = "b831381d-6324-4d53-ad4f-8cda48b30811"   # password 即 VLESS UUID
#   sni = "localhost"        # 域名证书填证书域名，IP + insecure = true 可省
#   insecure = true          # 自签证书时需要
#   [outbounds.transport]
#   type = "ws"
#   [outbounds.transport.ws]
#   path = "/ws"

[[users]]
name = "alice"
# password 直接作为 VLESS UUID（与 outbound 的解析一致）。
password = "b831381d-6324-4d53-ad4f-8cda48b30811"

[[inbounds]]
type = "vless"
listen = "0.0.0.0:8443"
cert = "cert.pem"
key = "key.pem"

[inbounds.transport]
type = "ws"

[inbounds.transport.ws]
path = "/ws"
# 可选：校验客户端请求的 Host 头（与 outbound 的 Host/SNI 一致）；
# 不配置则接受任意 Host（CDN 回源改写 Host 的场景）。
# headers = { Host = "localhost" }

# --- 明文 ws 变体（CDN 已终止 TLS、回源为 http 时使用）---
# 用它替换上面的 [[inbounds]] / [inbounds.transport] 段（去掉 cert/key）：
# [[inbounds]]
# type = "vless"
# listen = "0.0.0.0:8080"
#
# [inbounds.transport]
# type = "ws"
#
# [inbounds.transport.ws]
# path = "/ws"

# 不配置 [inbounds.transport] 时为裸 VLESS-over-TCP（仍受 cert/key TLS 保护）。

[[outbounds]]
type = "direct"
tag = "direct-out"

[[rules]]
outbound = "direct-out"
