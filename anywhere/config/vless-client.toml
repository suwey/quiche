[dns]
fakeip = "198.18.0.0/15"

[[inbounds]]
type = "tun"
tag = "tun-in"
# addr defaults to "10.0.0.1/24"
# Linux desktop: set local_direct=false so systemd-resolved/Firefox DNS gets fake-ip.
# Router default is true.
local_direct = false

[[inbounds]]
type = "socks5"
listen = "127.0.0.1:1080"

[[outbounds]]
type = "vless"
tag = "C"
server = "11.11.1.11:2083"
password = "xxxxx"
sni = "h.p.dev"
fp = true
#mux = true, mux.pool not tested
transport_type = "ws"
transport_path = "/"
transport_headers.Host = "h.p.dev"

[[rules]]
outbound = "C"