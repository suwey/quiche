[ui]
secret = "admin"

[[inbounds]]
type = "tun"
tag = "tun-in"
# Android 分应用分流（VpnService 层，两者互斥只能设其一）：
# include_package = ["com.example.app"]  # 仅这些应用的流量进 VPN
# exclude_package = ["com.bank.app"]     # 这些应用的流量绕过 VPN 直连

# 双栈隧道（可选）：配置后 VPN 额外接管 v6（addAddress + ::/0 route）；
# 不配（默认）保持 v4-only。fake-ip AAAA 需要它才可达。
# addr6 = "fdfe:dcba:9876::1/64"

# DNS 静态 hosts 表（优先于规则/缓存/上游；0.0.0.0 = 屏蔽）：
# [dns]
# hosts = { "nas.lan" = "192.168.50.10", "ads.example.com" = "0.0.0.0" }
# fake-ip v6 池与 AAAA 策略（默认值如下）：
# fakeip_inet6_range = "fdfe:dcba:9876::/64"
# domain_strategy = "prefer_ipv4"   # prefer_ipv4 | prefer_ipv6 | ipv4_only

[[outbounds]]
type = "mless"
tag = "CF"
server = "REDACTED"
password = "5-9u0j-k-j"
sni = "h.c.c"

[outbounds.transport]
type = "ws"

[outbounds.transport.ws]
path = "/"
headers = { Host = "h.c.c" }

[[outbounds]]
type = "urltest"
tag = "auto"
outbounds = ["CF"]

[[rules]]
# protocol examples: "both:1232" "tcp:123,1132" "udp:123,2222"
protocol = "stun"  # both:3748,3749
outbound = "reject" # drop the traffic

[[rules]]
# some software use other ports such as Xunlei, recommend set direct mode in ui when download.
protocol = "bittorrent" # tcp:6881,6889 && udp:6881,
outbound = "direct"

[[rules]]
# NTP
protocol = "udp:123"
outbound = "direct"

[[rules]]
# mDNS
protocol = "udp:5353"
outbound = "direct"

[[rules]]
# NetBIOS
protocol = "udp:137,139"
outbound = "direct"

[[rules]]
# DHCP
protocol = "udp:67,68"
outbound = "direct"

[[rules]]
domain_suffix = [
    "lmstudio.ai",
    "rust-lang.org",
    "microsoft.com",
    "npmjs.org",
    "apple.com",
    "cdn-apple.com",
    "synologyupdate.com",
    "synology.com",
    "hf-mirror.com",
    "xethub.hf.co",
    "pythonhosted.org",
    "pytorch.org",
    "pypi.org",
    "wireshark.org"
]
outbound = "direct"

[[rules]]
geo_url = "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@sing/geo/geosite/private.srs"
outbound = "direct"

